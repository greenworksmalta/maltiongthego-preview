<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d6b6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MaltiOnTheGo">
<meta name="description" content="Survival Maltese for life and work in Malta — bite-sized lessons with native audio.">
<title>MaltiOnTheGo — Maltese for Life in Malta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ec;--card:#ffffff;--ink:#1f2933;--ink-2:#56616d;
    --primary:#0d6b6a;--primary-2:#0a5453;--accent:#e07b00;
    --good:#2d8a3e;--good-bg:#dff5e3;--bad:#c14545;--bad-bg:#fde4e4;
    --line:#e7e1d2;--shadow:0 1px 0 rgba(0,0,0,.04), 0 6px 18px rgba(20,30,40,.06);
    --radius:18px;--tap:64px;--maxw:520px;
    /* MaltiOnTheGo logo palette — used on the welcome hero */
    --brand-red:#c1302a;--brand-red-2:#971f1a;--brand-navy:#1f1f2e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* House rule: a single word must never split across two lines. Words wrap at
     spaces only; if a word is wider than its box it overflows rather than breaking
     mid-word. (overflow-wrap:break-word / word-break:break-all are deliberately
     avoided app-wide.) */
  *{overflow-wrap:normal;word-break:keep-all;hyphens:none;-webkit-hyphens:none}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.01em;font-size:18px;line-height:1.55;overscroll-behavior-y:contain}
  body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  main{max-width:var(--maxw);margin:0 auto;padding:8px 18px 140px}
  button{font-family:inherit;font-size:inherit;letter-spacing:inherit;cursor:pointer}
  h1,h2,h3{margin:0 0 .3em;line-height:1.2;letter-spacing:.005em}
  h1{font-size:1.7rem;font-weight:700}
  h2{font-size:1.3rem;font-weight:600}
  h3{font-size:1.05rem;font-weight:600;color:var(--ink-2)}
  p{margin:0 0 .8em}
  .mt{font-weight:600;color:var(--primary-2);letter-spacing:.005em}

  .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--bg)}
  .topbar .back{flex:0 0 auto;width:44px;height:44px;border:none;background:transparent;font-size:1.4rem;color:var(--ink-2);border-radius:12px}
  .topbar .back:active{background:var(--line)}
  .topbar .title{flex:1;min-width:0;font-weight:600;font-size:1rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Home shortcut — appears on every screen except home itself. Same visual
     weight as the back arrow so the topbar stays balanced. */
  .topbar .home-btn{flex:0 0 auto;width:40px;height:40px;border:none;background:transparent;font-size:1.15rem;color:var(--ink-2);border-radius:12px;padding:0;margin-right:4px}
  .topbar .home-btn:active{background:var(--line)}
  /* Tester-unlock badge on the home screen — visible only when ?unlock=… was
     used on this device. Small, dismissible-looking, doesn't compete with real UI. */
  .tester-banner{background:#fff7d6;border:1px solid #f0d97a;color:#7a5b00;padding:8px 12px;border-radius:10px;font-size:.82rem;margin:0 0 10px;letter-spacing:.01em}
  .topbar .xp{flex:0 0 auto;font-weight:600;color:var(--accent);font-size:.95rem;display:flex;align-items:center;gap:4px}

  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .35s ease;width:0%}

  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card .audio-btn{margin-left:auto}

  .hero{background:linear-gradient(135deg,var(--primary),#11827f);color:#fff;border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
  .hero h1{margin:0;color:#fff}
  .hero p{margin:4px 0 0;opacity:.9}
  .hero .sub{font-size:.9rem;opacity:.85;margin-top:6px;letter-spacing:.04em;text-transform:uppercase}

  /* Footer with update + version info */
  .app-footer{margin:32px 0 12px;padding:16px;text-align:center;font-size:.78rem;color:var(--ink-2);letter-spacing:.02em}
  .app-footer .update{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-weight:600;font-size:.82rem;cursor:pointer;transition:all .15s ease}
  .app-footer .update:active{transform:scale(.97);background:var(--bg)}
  .app-footer .update:hover{background:var(--bg);color:var(--ink)}
  .app-footer .ver{display:block;margin-top:8px;opacity:.6;font-size:.7rem;font-variant-numeric:tabular-nums}
  .app-footer .privacy-link{display:inline-block;margin-top:6px;color:var(--ink-2);font-size:.75rem;text-decoration:underline;text-underline-offset:2px;letter-spacing:.02em}
  .app-footer .privacy-link:hover{color:var(--primary)}

  /* Install prompt — bottom sheet that explains how to add the app to the home screen */
  .install-prompt{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(20,30,40,.08);padding:18px 20px calc(18px + env(safe-area-inset-bottom));max-width:var(--maxw);margin:0 auto;border-radius:18px 18px 0 0;z-index:30;transform:translateY(120%);transition:transform .3s ease}
  .install-prompt.show{transform:translateY(0)}
  .install-prompt h3{margin:0 0 4px;font-size:1.05rem;color:var(--brand-navy)}
  .install-prompt p{margin:0 0 12px;font-size:.92rem;color:var(--ink-2);line-height:1.5}
  .install-prompt .row{display:flex;align-items:center;gap:10px;margin-top:10px}
  .install-prompt .icon-step{flex:0 0 auto;width:32px;height:32px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
  .install-prompt .step-text{flex:1;font-size:.9rem;color:var(--ink)}
  .install-prompt .actions{display:flex;gap:8px;margin-top:14px}
  .install-prompt button{flex:1;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:.92rem;color:var(--ink-2);cursor:pointer}
  .install-prompt button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .install-prompt .close{position:absolute;top:10px;right:14px;background:transparent;border:none;font-size:1.2rem;color:var(--ink-2);cursor:pointer;padding:4px 8px;min-height:auto}

  /* Welcome hero — calm cream gradient with navy headline and a red accent.
     Pulls from the logo's three colours (cream / navy / red) without shouting. */
  .hero-welcome{position:relative;overflow:hidden;background:linear-gradient(135deg,#fffdf6 0%,#f5efe0 100%);color:var(--ink);border-radius:var(--radius);padding:24px 24px 26px;margin-bottom:18px;box-shadow:0 1px 0 rgba(0,0,0,.04), 0 6px 18px rgba(20,30,40,.06);border:1px solid var(--line)}
  .hero-welcome .eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-red);display:inline-block;margin:0}
  .hero-welcome h1{font-size:1.7rem;font-weight:700;color:var(--brand-navy);margin:6px 0 0;line-height:1.18;letter-spacing:.005em}
  .hero-welcome p{color:var(--ink-2);margin:10px 0 0;font-size:1rem;line-height:1.55}
  .hero-welcome .accent-bar{display:block;width:44px;height:4px;background:var(--brand-red);border-radius:99px;margin:14px 0 0}

  /* Branded hero — uses the real MaltiOnTheGoLogo at full bleed on near-white. */
  .hero-branded{position:relative;overflow:hidden;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;background:#fefefe;aspect-ratio:3/2;max-height:280px}
  .hero-branded img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}

  .section-list{display:flex;flex-direction:column;gap:12px}
  .section-card{display:grid;grid-template-columns:56px 1fr 24px;gap:14px;align-items:center;padding:18px;background:var(--card);border:none;border-radius:var(--radius);box-shadow:var(--shadow);text-align:left;width:100%;color:var(--ink);transition:transform .12s ease}
  .section-card:active{transform:scale(.985)}
  .section-card .icon{width:56px;height:56px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.7rem}
  .section-card .meta strong{display:block;font-size:1.1rem;font-weight:700}
  .section-card .meta span{display:block;font-size:.92rem;color:var(--ink-2);margin-top:2px}
  .section-card .chev{color:var(--ink-2);font-size:1.3rem;justify-self:end}
  .section-card .pct{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:600;color:var(--primary)}
  .section-card .barwrap{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
  .section-card .barwrap > div{height:100%;background:var(--primary);width:0%}
  .section-card.done .icon{background:var(--good-bg)}
  .section-card.done .pct{color:var(--good)}
  /* FREE badge for the starter lesson card — teal pill with explicit white text */
  .section-card .title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .section-card .badge-free{flex:0 0 auto;background:var(--primary);color:#ffffff !important;font-size:.78rem;font-weight:800;letter-spacing:.1em;padding:4px 11px;border-radius:99px;line-height:1.4;text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .section-card.is-free{border:2px solid var(--primary);box-shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 18px rgba(13,107,106,.14)}
  .section-card.is-free .icon{background:#e0efef}
  /* Locked lesson card — dimmed icon, slate lock pill, "Unlock" pct in red. */
  .section-card.is-locked{opacity:.78}
  .section-card.is-locked .icon{filter:grayscale(.6)}
  .section-card .badge-lock{flex:0 0 auto;background:#eef0f5;color:#4a5566;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;line-height:1.4}
  .section-card .pct.locked-pct{color:var(--bad);font-weight:700}

  /* Phrase search */
  .search-entry{display:grid;grid-template-columns:48px 1fr 24px;gap:14px;align-items:center;padding:14px 18px;background:var(--card);border:none;border-radius:var(--radius);box-shadow:var(--shadow);text-align:left;width:100%;color:var(--ink);margin-bottom:18px;transition:transform .12s ease}
  .search-entry:active{transform:scale(.99)}
  .search-entry .search-entry-icon{width:48px;height:48px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
  .search-entry .search-entry-meta strong{display:block;font-size:1.05rem;font-weight:700}
  .search-entry .search-entry-meta span{display:block;font-size:.88rem;color:var(--ink-2);margin-top:2px}
  .search-entry .chev{color:var(--ink-2);font-size:1.2rem;justify-self:end}
  .search-entry.locked{opacity:.82}
  .search-entry.locked .search-entry-icon{filter:grayscale(.55)}
  .search-hint{color:var(--ink-2);font-size:.95rem;line-height:1.5;margin:4px 0 14px}
  .search-box{margin-bottom:12px}
  .search-input{width:100%;min-height:var(--tap);padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:1.05rem;-webkit-appearance:none;box-sizing:border-box}
  .search-input:focus{outline:none;border-color:var(--primary)}
  .search-status{font-size:.85rem;font-weight:600;color:var(--ink-2);min-height:1.1em;margin-bottom:10px}
  .search-results{display:flex;flex-direction:column;gap:10px}
  .search-group-label{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:8px 2px 0}
  .search-group-label:first-child{margin-top:0}
  .search-result{display:grid;grid-template-columns:1fr 24px;gap:12px;align-items:center;padding:14px 16px;background:var(--card);border:none;border-radius:var(--radius);box-shadow:var(--shadow);text-align:left;width:100%;color:var(--ink);transition:transform .12s ease}
  .search-result.topic{grid-template-columns:44px 1fr 24px}
  .search-result .search-result-icon{width:44px;height:44px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
  .search-result:active{transform:scale(.99)}
  .search-result .search-mt{display:block;font-size:1.1rem;font-weight:700;color:var(--brand-navy)}
  .search-result .search-tr{display:block;font-size:.95rem;color:var(--ink-2);margin-top:2px}
  .search-result .search-where{display:block;font-size:.78rem;font-weight:600;color:var(--primary);margin-top:6px}
  .search-result .chev{color:var(--ink-2);font-size:1.2rem;justify-self:end}
  .search-lock{text-align:center;padding:32px 20px}
  .search-lock-icon{font-size:2.6rem}
  .search-lock h2{margin:12px 0 6px;color:var(--brand-navy)}
  .search-lock p{color:var(--ink-2);margin:0 auto 18px;max-width:32ch;line-height:1.5}

  /* Paywall */
  .paywall-hero{padding:18px 4px 6px}
  .paywall-hero h1{font-size:1.55rem;margin:0 0 6px;color:var(--ink)}
  .paywall-hero p{font-size:1rem;color:var(--ink-2);margin:0}
  .paywall-current{display:inline-block;margin:6px 4px 12px;padding:6px 14px;border-radius:99px;background:var(--good-bg);color:var(--good);font-weight:700;font-size:.85rem;letter-spacing:.04em}
  .paywall-tiers{display:flex;flex-direction:column;gap:14px;margin:8px 0 22px}
  .paywall-tier{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);position:relative}
  .paywall-tier.featured{border-color:var(--primary);box-shadow:0 1px 0 rgba(0,0,0,.04), 0 12px 24px rgba(13,107,106,.16)}
  .paywall-tier.featured::before{content:"★";position:absolute;top:-12px;right:18px;background:var(--primary);color:#fff;padding:4px 12px;border-radius:99px;font-size:.78rem;font-weight:800;letter-spacing:.06em}
  .paywall-tier.owned{opacity:.7}
  .paywall-tier-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .paywall-tier h2{margin:0;font-size:1.25rem;color:var(--ink)}
  .paywall-price-row{text-align:right;line-height:1.1}
  .paywall-price{display:block;font-size:1.4rem;font-weight:800;color:var(--primary-2)}
  .paywall-tag{font-size:.78rem;color:var(--ink-2);letter-spacing:.02em}
  .paywall-body{font-size:.95rem;color:var(--ink-2);margin:10px 0 14px;line-height:1.45}
  .paywall-cta{width:100%;min-height:var(--tap);background:var(--primary);color:#fff;border:none;border-radius:14px;font-weight:700;font-size:1rem;letter-spacing:.02em}
  .paywall-cta:disabled{background:var(--good);opacity:.65;cursor:default}
  .paywall-perks{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 22px;box-shadow:var(--shadow)}
  .paywall-perks h3{margin:0 0 10px;font-size:1rem;color:var(--ink)}
  .paywall-perk{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--ink-2);line-height:1.4;padding:5px 0}
  .paywall-perk .tick{color:var(--primary);font-weight:800;flex:none}
  .paywall-restore{margin:12px 0 6px;text-align:center}
  .paywall-restore .muted{font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
  .paywall-restore-btn{background:transparent;border:1.5px solid var(--ink-2);color:var(--ink);padding:10px 22px;border-radius:99px;font-weight:600;font-size:.95rem}
  .paywall-meta{margin-top:20px;text-align:center}
  .paywall-meta .small{font-size:.78rem;color:var(--ink-2)}
  .paywall-dev{margin:18px 0 0;padding:14px;background:#fff7d6;border:1px dashed #c2a32a;border-radius:12px;text-align:center}
  .paywall-dev .muted{font-size:.78rem;color:#7a5b00;margin:0 0 8px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
  .paywall-dev-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .paywall-dev-row .dev-btn{background:#fff;border:1px solid #c2a32a;color:#7a5b00;padding:6px 14px;border-radius:99px;font-weight:600;font-size:.85rem}

  .module-label{font-size:.78rem;color:var(--ink-2);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:18px 4px 8px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 22px;border-radius:14px;border:none;background:var(--primary);color:#fff;font-weight:600;font-size:1.05rem;width:100%;transition:transform .1s ease, background .15s ease;margin-top:8px}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.secondary{background:var(--card);color:var(--ink);border:2px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--primary);font-weight:600}

  .audio-btn{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:1.2rem;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .audio-btn:active{transform:scale(.94)}
  .audio-btn.playing{animation:pulse 1.2s ease-out infinite}
  .audio-btn.sm{width:38px;height:38px;font-size:.95rem}
  .audio-btn.lg{width:64px;height:64px;font-size:1.6rem}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(13,107,106,.45)}100%{box-shadow:0 0 0 14px rgba(13,107,106,0)}}

  .flash{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 18px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);position:relative}
  .flash .mtword{font-size:2rem;font-weight:700;color:var(--primary-2);margin:6px 0 10px;letter-spacing:.005em;line-height:1.2}
  .flash .enword{font-size:1.15rem;color:var(--ink-2);margin-top:2px;min-height:1.4em}
  .flash .audio-btn{margin-top:12px;width:64px;height:64px;font-size:1.6rem}
  .flash .hint{position:absolute;top:12px;right:14px;font-size:.78rem;color:var(--ink-2);opacity:.6;letter-spacing:.04em;text-transform:uppercase}
  .flash .alt{color:var(--ink-2);font-size:.95rem;margin-top:-4px}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .choices.col{grid-template-columns:1fr}
  .choice{min-height:var(--tap);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:1.05rem;font-weight:600;color:var(--ink);text-align:center;transition:transform .1s ease, background .15s ease, border-color .15s ease;letter-spacing:.005em}
  .choice:active{transform:scale(.98)}
  .choice.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .choice.dim{opacity:.45}

  /* Skip button — appears under exercise choices so the learner can move on without answering. */
  .btn-skip{display:block;margin:18px auto 0;padding:10px 22px;border-radius:99px;background:transparent;border:1px solid var(--line);color:var(--ink-2);font-size:.92rem;font-weight:600;cursor:pointer;letter-spacing:.005em}
  .btn-skip:active{transform:scale(.98);background:var(--bg)}
  .btn-skip:hover{background:var(--bg);border-color:var(--ink-2)}
  .prev-wrap{display:flex;justify-content:center;margin-top:12px}
  /* Two-row nav: row 1 = ← Previous | Next →  (share the width); row 2 = Skip →
     (centred, narrower). Next section is in the topbar, not here. */
  .prev-wrap.nav-col{flex-direction:column;align-items:stretch;gap:8px}
  .prev-wrap.nav-col .nav-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:nowrap}
  .prev-wrap.nav-col .nav-row .btn-prev{flex:1 1 0}
  .prev-wrap.nav-col .btn-next{font-weight:700}
  .prev-wrap.nav-col .btn-skip{align-self:center;padding-left:28px;padding-right:28px;color:var(--ink-2);opacity:.8}
  /* "Next section" lives in the topbar next to Home. */
  .topbar .nextsec-btn{margin-left:2px}
  .btn-prev{padding:8px 20px;border-radius:99px;background:transparent;border:1px solid var(--line);color:var(--ink-2);font-size:.88rem;font-weight:600;cursor:pointer;letter-spacing:.005em}
  .btn-prev:active{transform:scale(.98);background:var(--bg)}
  .btn-prev:hover{background:var(--bg);border-color:var(--ink-2)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
  .chip{min-height:54px;min-width:64px;padding:0 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:1.1rem;color:var(--primary-2);transition:transform .1s ease, background .15s ease, border-color .15s ease}
  .chip:active{transform:scale(.96)}
  .chip.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .chip.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

  .built{min-height:60px;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
  .pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .tile{padding:8px 14px;background:var(--card);border:2px solid var(--line);border-radius:10px;font-weight:600;font-size:1rem;color:var(--primary-2)}
  .tile.used{visibility:hidden}
  .tile.sel{border-color:var(--primary);background:var(--good-bg)}
  .tile.right{border-color:var(--good);background:var(--good-bg)}
  .tile.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .tile.mini{font-size:.85rem;padding:5px 9px;margin:3px 3px 0 0}
  /* bucket-sort exercise */
  .bucket-pool{margin-bottom:14px}
  .bucket-chip.done{opacity:.45}
  .bucket-row{display:flex;gap:10px;flex-wrap:wrap}
  .bucket{flex:1 1 0;min-width:120px;border:2px dashed var(--line);border-radius:12px;padding:10px;background:var(--card)}
  .bucket-label{font-weight:800;color:var(--primary-2);text-align:center;margin-bottom:6px}
  .bucket-drop{display:flex;flex-wrap:wrap;min-height:40px}

  .match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .match button{min-height:58px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:.95rem;color:var(--ink);text-align:center;letter-spacing:.005em}
  .match button.sel{border-color:var(--primary);background:#e9f5f5}
  .match button.right{background:var(--good-bg);border-color:var(--good);color:var(--good);pointer-events:none}
  .match button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

  .feedback{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:2px solid var(--line);transform:translateY(120%);transition:transform .25s ease;z-index:20;max-width:var(--maxw);margin:0 auto;border-radius:18px 18px 0 0}
  .feedback.show{transform:translateY(0)}
  .feedback.good{background:var(--good-bg);border-color:var(--good)}
  .feedback.bad{background:var(--bad-bg);border-color:var(--bad)}
  .feedback h3{margin:0 0 4px;font-size:1rem}
  .feedback.good h3{color:var(--good)}
  .feedback.bad h3{color:var(--bad)}
  .feedback p{margin:0;font-size:.95rem;color:var(--ink-2)}
  .feedback .row{display:flex;align-items:center;gap:12px}
  .feedback .row > div{flex:1;min-width:0}
  .feedback .next{flex:0 0 auto;min-height:50px;padding:0 22px;border-radius:12px;background:var(--ink);color:#fff;border:none;font-weight:700}
  .feedback.good .next{background:var(--good)}
  .feedback.bad .next{background:var(--bad)}

  .letter-card{display:flex;flex-direction:column;align-items:center;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;text-align:center}
  .letter-card .big{font-size:5rem;font-weight:700;color:var(--primary-2);line-height:1;margin:6px 0 4px}
  .letter-card .lower{font-size:1.3rem;color:var(--ink-2);margin-bottom:14px}
  .letter-card .examples{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px}
  .letter-card .ex{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg);border-radius:12px;text-align:left}
  .letter-card .ex .audio-btn{width:42px;height:42px;font-size:1rem}
  .letter-card .ex .mt{font-weight:700;font-size:1.05rem}
  .letter-card .ex .en{color:var(--ink-2);font-size:.92rem;margin-left:auto}

  .passage-line{display:flex;align-items:flex-start;gap:12px;padding:12px;background:var(--card);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .passage-line .audio-btn{flex:0 0 auto;width:40px;height:40px;font-size:.95rem;margin-top:2px}
  .passage-line .txt .mt{font-weight:700;color:var(--primary-2);display:block;margin-bottom:2px;font-size:1.02rem}
  .passage-line .txt .en{color:var(--ink-2);font-size:.92rem}

  .rule h2{display:flex;align-items:center;gap:10px;font-size:1.15rem}
  .rule .letters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
  /* nowrap so multi-word chips like "Bonġu (French)" / "Skużi (Italian)" stay
     on a single line; the flex container wraps between chips, not inside them. */
  .rule .letters span{padding:6px 12px;background:var(--bg);border-radius:99px;font-weight:700;color:var(--primary-2);min-width:34px;text-align:center;white-space:nowrap}
  .rule .examples-grid{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .rule .examples-grid .ex{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:10px;min-height:56px}
  .rule .examples-grid .ex .audio-btn{width:38px;height:38px;font-size:.9rem;flex:0 0 38px;align-self:center}
  .rule .examples-grid .ex .grow{flex:1 1 auto;min-width:0;display:flex;align-items:center}
  .rule .examples-grid .ex .full{font-weight:700;color:var(--primary-2);overflow-wrap:normal;word-break:keep-all}
  .rule .examples-grid .ex .en{flex:0 1 auto;margin-left:auto;color:var(--ink-2);font-size:.9rem;text-align:right;overflow-wrap:normal;word-break:keep-all}

  /* multi-form (colour/adjective/fruit) card */
  .forms{display:flex;flex-direction:column;gap:8px}
  .form-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:10px}
  .form-row .audio-btn{width:38px;height:38px;font-size:.95rem;flex:0 0 auto}
  .form-row .label{flex:0 0 auto;font-size:.72rem;color:var(--ink-2);font-weight:700;letter-spacing:.04em;text-transform:uppercase;min-width:54px}
  .form-row .mtform{font-weight:700;color:var(--primary-2);flex:1 1 auto;min-width:0;overflow-wrap:normal;word-break:keep-all}
  .form-row .en{flex:0 1 auto;color:var(--ink-2);font-size:.88rem;text-align:right;min-width:0}

  .colour-swatch{width:42px;height:42px;border-radius:10px;flex:0 0 auto;border:2px solid var(--line)}

  .number-card{text-align:center;padding:30px 18px}
  .number-card .num{font-size:5rem;font-weight:700;color:var(--primary-2);line-height:1}
  .number-card .mtword{font-size:1.4rem;color:var(--ink);margin-top:8px;font-weight:600}
  .number-card .enword{color:var(--ink-2);margin-top:4px}

  .conj-table{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;margin-top:8px}
  .conj-table .row{display:contents}
  .conj-table .person{padding:8px 0;color:var(--ink-2);font-weight:600;font-size:.92rem}
  .conj-table .form-cell{padding:8px 12px;background:var(--bg);border-radius:8px;font-weight:700;color:var(--primary-2)}
  .conj-table .audio-btn{width:36px;height:36px;font-size:.85rem;align-self:center}

  .syllable-card{text-align:center;padding:30px 20px}
  .syllable-card .word{font-size:2rem;font-weight:700;color:var(--primary-2);margin-bottom:12px}
  .syllable-card .split{font-size:1.5rem;color:var(--accent);font-weight:600;letter-spacing:.05em;min-height:1.6em}

  /* Overview podcast player */
  .overview-card{display:grid;grid-template-columns:56px 1fr 24px;gap:14px;align-items:center;padding:18px;background:linear-gradient(135deg,#11827f,#0d6b6a);color:#fff;border:none;border-radius:var(--radius);box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .12s ease;margin-bottom:14px}
  .overview-card:active{transform:scale(.985)}
  .overview-card .icon{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:1.7rem}
  .overview-card .meta strong{display:block;font-size:1.1rem;font-weight:700;color:#fff}
  .overview-card .meta span{display:block;font-size:.92rem;color:rgba(255,255,255,.85);margin-top:2px}
  .overview-card .chev{color:rgba(255,255,255,.7);font-size:1.3rem;justify-self:end}

  .player{position:sticky;top:60px;background:var(--card);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);z-index:5;margin-bottom:14px}
  .player .controls{display:flex;align-items:center;gap:12px}
  .player .play-big{flex:0 0 auto;width:64px;height:64px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:1.8rem;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .player .play-big:active{transform:scale(.96)}
  .player .skip{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;font-weight:700}
  .player .meta{flex:1;min-width:0}
  .player .meta .t{font-weight:700;color:var(--ink);font-size:.95rem}
  .player .meta .s{font-size:.82rem;color:var(--ink-2)}
  .player .bar{margin-top:10px;display:flex;align-items:center;gap:8px}
  .player .bar input[type=range]{flex:1;min-width:0;height:38px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
  .player .bar input[type=range]::-webkit-slider-runnable-track{height:8px;background:var(--line);border-radius:99px}
  .player .bar input[type=range]::-moz-range-track{height:8px;background:var(--line);border-radius:99px}
  .player .bar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.2);margin-top:-8px;border:2px solid #fff}
  .player .bar input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.2);border:2px solid #fff}
  .player .bar input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
  .player .bar input[type=range]:active::-moz-range-thumb{transform:scale(1.15)}
  .player .bar .time{font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600;min-width:32px;text-align:center}
  .player .speed{display:flex;gap:6px;margin-top:8px;justify-content:center}
  .player .speed button{padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.78rem;font-weight:700;color:var(--ink-2);min-height:32px}
  .player .speed button.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .lang-toggle{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
  .lang-toggle .lang-btn{padding:8px 16px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink-2);font-weight:600;font-size:.9rem;min-height:40px;cursor:pointer;transition:all .15s ease}
  .lang-toggle .lang-btn:active{transform:scale(.96)}
  .lang-toggle .lang-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .chapters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;padding:0 2px}
  .chapters .label{flex:0 0 100%;font-size:.72rem;color:var(--ink-2);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;padding-left:2px}
  .chapters .ch{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.82rem;font-weight:600;color:var(--primary-2);min-height:36px;display:inline-flex;align-items:center;gap:4px;line-height:1;text-align:left;max-width:100%}
  .chapters .ch:active{transform:scale(.96)}
  .chapters .ch.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .chapters .ch .t{font-size:.7rem;opacity:.7;font-variant-numeric:tabular-nums;font-weight:500}

  .transcript{display:flex;flex-direction:column;gap:6px}
  .transcript .seg{padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid transparent;transition:background .2s, border-color .2s, transform .2s;position:relative}
  .transcript .seg.en{color:var(--ink)}
  .transcript .seg.mt{background:#eaf3f3;color:var(--primary-2);font-weight:600;letter-spacing:.005em}
  .transcript .seg.active{background:#fff5d9;border-color:var(--accent);box-shadow:0 1px 0 rgba(0,0,0,.04), 0 4px 14px rgba(224,123,0,.18)}
  .transcript .seg.played{opacity:.6}

  /* Coloured callout kinds */
  .transcript .seg.header{font-size:1.35rem;font-weight:800;text-align:center;padding:18px 12px 6px;color:var(--primary-2);background:transparent;letter-spacing:.005em;line-height:1.25}
  .transcript .seg.rule{background:#e8f5e9;border:none;border-left:5px solid var(--good);padding-left:14px;font-weight:600;color:#1f4d2a}
  .transcript .seg.rule::before{content:"📌  "}
  .transcript .seg.key{background:#fff3d6;border:none;border-left:5px solid var(--accent);padding-left:14px;font-weight:700;color:#5b3b00}
  .transcript .seg.key::before{content:"⭐  "}
  .transcript .seg.tip{background:#f0e6f7;border:none;border-left:5px solid #824aa9;padding-left:14px;color:#3e1c5a}
  .transcript .seg.tip::before{content:"💡  "}
  .transcript .seg.warn{background:#ffe9e0;border:none;border-left:5px solid #c14545;padding-left:14px;color:#5e1a1a}
  .transcript .seg.warn::before{content:"⚠️  "}
  .transcript .seg.win{background:var(--good-bg);color:var(--good);font-weight:800;text-align:center;padding:14px;font-size:1.05rem}
  .transcript .seg.fact{background:#e0effa;border:none;border-left:5px solid #1f6fb2;padding-left:14px;color:#103552;font-weight:600}
  .transcript .seg.fact::before{content:"🎯  "}

  /* Make segments visibly tappable */
  .transcript .seg{cursor:pointer;-webkit-user-select:none;user-select:none}
  .transcript .seg:hover{filter:brightness(.97)}
  .transcript .seg.header{cursor:default}

  /* Inline highlight: **word** -> .hl */
  .transcript .hl{background:linear-gradient(transparent 55%, #ffe98e 55%);padding:0 3px;font-weight:700;color:var(--ink)}
  .transcript .seg.en .hl,
  .transcript .seg.rule .hl,
  .transcript .seg.key .hl,
  .transcript .seg.tip .hl,
  .transcript .seg.fact .hl{color:inherit}

  .done-screen{text-align:center;padding:40px 18px}
  .done-screen .emoji{font-size:4rem;margin-bottom:8px}
  .done-screen h1{font-size:1.5rem;color:var(--good)}
  .done-screen p{color:var(--ink-2)}
  .done-screen .stats{display:flex;justify-content:center;gap:18px;margin:18px 0 24px;flex-wrap:wrap}
  .done-screen .stat{padding:12px 16px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);min-width:90px}
  .done-screen .stat strong{display:block;font-size:1.6rem;color:var(--accent)}
  .done-screen .stat span{font-size:.85rem;color:var(--ink-2)}

  .row{display:flex;align-items:center;gap:12px}
  .row .grow{flex:1;min-width:0}
  .center{text-align:center}
  .muted{color:var(--ink-2);font-size:.95rem}
  .mtline{font-weight:700;color:var(--primary-2);font-size:1.4rem;letter-spacing:.005em}

  /* Update-confirmation banner — slides in from the top after a force-update so the
     user sees the new version immediately, instead of having to scroll to the footer.
     Two flavours: green (.update-banner alone) confirms the update succeeded, orange
     (.update-banner.upgrade) prompts the user to refresh when a new SW is ready. */
  .update-banner{position:fixed;top:env(safe-area-inset-top);left:0;right:0;background:var(--good);color:#fff;padding:12px 18px;text-align:center;font-weight:600;font-size:.95rem;letter-spacing:.005em;transform:translateY(-110%);transition:transform .25s ease;z-index:50;box-shadow:0 4px 14px rgba(45,138,62,.3);max-width:var(--maxw);margin:0 auto;border-radius:0 0 14px 14px;cursor:pointer}
  .update-banner.show{transform:translateY(0)}
  .update-banner.upgrade{background:var(--accent);box-shadow:0 4px 14px rgba(224,123,0,.3);padding-right:42px}
  .update-banner-close{position:absolute;top:50%;right:8px;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:none;width:28px;height:28px;border-radius:50%;font-size:1.1rem;line-height:1;font-weight:700;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .update-banner-close:hover{background:rgba(255,255,255,.28)}
  .update-banner-close:active{transform:translateY(-50%) scale(.92)}

  /* Vocabulary study card — grouped list of words with optional icon */
  .vocab-group .vocab-head{margin-bottom:10px}
  .vocab-group .vocab-group-icon{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
  .vocab-group h3{margin:0;color:var(--ink);font-size:1.05rem;font-weight:700}
  .vocab-list{display:flex;flex-direction:column;gap:6px}
  .vocab-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;background:var(--bg);border-radius:10px;text-align:left;cursor:pointer}
  /* Override global ".card .audio-btn{margin-left:auto}" which would push the speaker
     to the right end of the row by a different amount per item, breaking the column. */
  .vocab-item .audio-btn{flex:0 0 auto;margin-left:0;margin-top:1px}
  /* Wide enough for two keycap emojis side-by-side (e.g. 1️⃣2️⃣ for 12) without
     clipping into the Maltese text column. Single emojis just sit centred in the
     wider box. Android renders keycaps wider than iOS, so we need extra width
     here AND a smaller font-size to keep both-platform overlap from happening. */
  .vocab-icon{flex:0 0 auto;width:64px;text-align:center;font-size:1rem;line-height:38px;align-self:flex-start;letter-spacing:-0.5px}
  .vocab-item .vocab-text{flex:1 1 auto;min-width:0}
  .vocab-item .vocab-text .mt{font-weight:700;color:var(--primary-2);font-size:1rem;letter-spacing:.005em;overflow-wrap:normal;word-break:keep-all}
  .vocab-item .vocab-text .en{color:var(--ink-2);font-size:.88rem;margin-top:2px}
  .vocab-item .vocab-text .muted{font-size:.82rem;margin-top:2px}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="feedback" class="feedback" role="status"></div>
<div id="install-prompt" class="install-prompt" role="dialog" aria-hidden="true"></div>
<audio id="player" preload="auto"></audio>
<!-- Runtime config (Sentry DSN, Plausible domain) — see app-config.example.js.
     Loaded before app.js so window.MALTI_CONFIG is available at boot. The file
     is gitignored; the .example one is the canonical shape. -->
<script src="app-config.js?v=1.0.0-beta.8"></script>
<script src="app.js?v=20260601bb"></script>
<!-- Service-worker registration moved into app.js so we can show an in-app
     "Update available" banner when a new version is detected mid-session. -->

</body>
</html>
